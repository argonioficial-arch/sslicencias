<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Panel de licencias · Sintaxis Studio</title>
<style>
:root{--bg:#0f1115;--p:#171a21;--p2:#1e222b;--b:#2a303c;--t:#e8ecf3;--m:#8d97a8;--a:#78a8ff;--ok:#4ade80;--w:#fbbf24;--e:#f87171}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--b);background:var(--p);position:sticky;top:0;z-index:5}
header b{font-size:16px}header b i{color:var(--a);font-style:normal}header .sp{flex:1}
nav{display:flex;gap:4px;flex-wrap:wrap}nav button{background:none;border:0;color:var(--m);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}nav button.on{background:var(--p2);color:var(--t)}
main{padding:20px;max-width:1280px;margin:auto}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:16px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.st{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:14px}.st b{display:block;font-size:26px}.st span{color:var(--m);font-size:12px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--b);vertical-align:middle}th{color:var(--m);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.tw{overflow:auto}tr:hover td{background:#ffffff06}
input,select,textarea{background:var(--bg);border:1px solid var(--b);color:var(--t);border-radius:8px;padding:8px 10px;font:inherit;min-width:0}
input:focus,select:focus{outline:2px solid var(--a);outline-offset:-1px}
label{display:block;color:var(--m);font-size:12px;margin:0 0 4px}.f{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.f>div{flex:1;min-width:140px}.f input,.f select{width:100%}
button.b{background:var(--a);color:#06101f;border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:600;cursor:pointer}button.b.g{background:var(--p2);color:var(--t);border:1px solid var(--b)}button.b.r{background:#3a1d1f;color:var(--e);border:1px solid #5a2a2d}button.b.s{padding:4px 9px;font-size:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:var(--p2);color:var(--m)}.tag.active,.tag.available{color:var(--ok)}.tag.suspended,.tag.reserved,.tag.pending,.tag.disabled{color:var(--w)}.tag.blocked,.tag.revoked,.tag.released{color:var(--e)}.tag.activated{color:var(--a)}
.bar{height:6px;background:var(--b);border-radius:9px;overflow:hidden;min-width:70px}.bar i{display:block;height:100%;background:var(--a)}
.msg{padding:10px 12px;border-radius:8px;margin-bottom:12px}.msg.e{background:#3a1d1f;color:#fecaca}.msg.o{background:#12301e;color:#bbf7d0}
#login{max-width:380px;margin:12vh auto}.hint{color:var(--m);font-size:12px}
.codes{font:13px ui-monospace,Consolas,monospace;background:var(--bg);border:1px dashed var(--a);border-radius:8px;padding:12px;max-height:260px;overflow:auto;white-space:pre}
.mo{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.mo .card{max-width:560px;width:100%;margin:0;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}h2{margin:0 0 12px;font-size:16px}
</style></head><body>
<div id="app"></div>
<script>
const CFG={url:"https://czsxxznvhxkxapxlygyo.supabase.co",key:"sb_publishable_tTVr7X63HKgMFGWKYtV_-A_H41-HlRg"};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ERR={LICENSE_NOT_FOUND:"Licencia no encontrada",SERIAL_INVALID:"Número de serie no válido",SERIAL_USED:"Número de serie ya utilizado",SERIAL_BLOCKED:"Número de serie bloqueado o revocado",LICENSE_SUSPENDED:"Licencia suspendida",LICENSE_EXPIRED:"Licencia caducada",RADIO_LIMIT:"Límite de radios alcanzado",USER_LIMIT:"Límite de usuarios alcanzado",USER_NOT_AUTHORIZED:"Usuario no autorizado",DEVICE_BLOCKED:"Dispositivo bloqueado",SERIAL_CAPACITY:"El lote superaría el máximo de radios de la licencia",BATCH_EXISTS:"Ya existe un lote con ese nombre en la licencia",LIMIT_BELOW_USAGE:"No puedes bajar el límite por debajo de lo que ya está en uso",LICENSE_KEY_EXISTS:"Ya existe una licencia con esa clave",BAD_REQUEST:"Datos no válidos",USER_EXISTS:"Ese correo ya tiene cuenta",FORBIDDEN:"Sin permisos de administrador",UNAUTHORIZED:"Sesión caducada",RATE_LIMITED:"Demasiadas peticiones, espera un momento",BAD_CREDENTIALS:"Credenciales incorrectas"};
const er=c=>ERR[c]||c||"Error";
let S={tok:null,ref:null,tab:"stats",msg:null,modal:null,lic:[],data:{}};
try{const x=JSON.parse(sessionStorage.getItem("lp")||"null");if(x){S.tok=x.t;S.ref=x.r}}catch(e){}
async function auth(body,q){const r=await fetch(CFG.url+"/auth/v1/"+q,{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error_description||j.msg||"Credenciales incorrectas");S.tok=j.access_token;S.ref=j.refresh_token;try{sessionStorage.setItem("lp",JSON.stringify({t:S.tok,r:S.ref}))}catch(e){}return j}
async function refresh(){if(!S.ref)throw new Error("Sesión caducada");await auth({refresh_token:S.ref},"token?grant_type=refresh_token")}
async function rest(path,retry=true){const r=await fetch(CFG.url+"/rest/v1/"+path,{headers:{apikey:CFG.key,Authorization:"Bearer "+S.tok}});if(r.status===401&&retry){await refresh();return rest(path,false)}if(!r.ok)throw new Error("Lectura: "+r.status);return r.json()}
async function fn(name,body,retry=true){const r=await fetch(CFG.url+"/functions/v1/"+name,{method:"POST",headers:{apikey:CFG.key,Authorization:"Bearer "+S.tok,"Content-Type":"application/json"},body:JSON.stringify(body)});const j=await r.json().catch(()=>({ok:false}));if(r.status===401&&retry&&j.error==="UNAUTHORIZED"){await refresh();return fn(name,body,false)}if(!j.ok)throw new Error(er(j.error));return j}
const fd=d=>d?new Date(d).toLocaleString("es-ES",{dateStyle:"short",timeStyle:"short"}):"—";
const tag=s=>`<span class="tag ${esc(s)}">${esc(({active:"activa",suspended:"suspendida",revoked:"revocada",available:"disponible",reserved:"reservado",activated:"activado",blocked:"bloqueado",disabled:"desactivado",pending:"pendiente",released:"liberado"})[s]||s)}</span>`;
const note=(m,ok)=>{S.msg=m?{m,ok}:null;const el=$("#msg");if(el)el.innerHTML=m?`<div class="msg ${ok?"o":"e"}">${esc(m)}</div>`:""};
async function act(f){try{note("");await f();}catch(e){note(e.message)}}

/* ---------- vistas ---------- */
function loginView(boot){$("#app").innerHTML=`<div id="login" class="card"><h2><b>Panel de licencias</b> · Sintaxis Studio</h2><div id="msg"></div>
<div class="f"><div><label>Correo</label><input id="em" type="email" autocomplete="username"></div></div><div class="f"><div><label>Contraseña</label><input id="pw" type="password" autocomplete="current-password"></div></div>
${boot?`<div class="f"><div><label>Token de instalación (solo la primera vez)</label><input id="tk"></div></div>`:""}
<div class="row"><button class="b" id="go">${boot?"Crear administrador":"Entrar"}</button><button class="b g" id="sw">${boot?"Ya tengo cuenta":"Primer acceso"}</button></div>
<p class="hint">${boot?"La contraseña debe tener 10 caracteres o más. El token se usa una sola vez.":"Acceso solo para administradores."}</p></div>`;
$("#sw").onclick=()=>loginView(!boot);
$("#go").onclick=()=>act(async()=>{const e=$("#em").value.trim(),p=$("#pw").value;
 if(boot){const r=await fetch(CFG.url+"/functions/v1/admin-manage",{method:"POST",headers:{apikey:CFG.key,"Content-Type":"application/json"},body:JSON.stringify({action:"bootstrap",email:e,password:p,token:$("#tk").value.trim()})});const j=await r.json();if(!j.ok)throw new Error(er(j.error))}
 await auth({email:e,password:p},"token?grant_type=password");await start()})}
async function start(){try{S.lic=await rest("licenses?select=*&order=created_at.desc");}catch(e){S.tok=null;return loginView(false)}render()}
function shell(inner){const T=[["stats","Estadísticas"],["lic","Licencias"],["ser","Números de serie"],["dev","Radios"],["usr","Usuarios"],["aud","Auditoría"]];
$("#app").innerHTML=`<header><b>Sintaxis <i>Studio</i> · Licencias</b><nav>${T.map(t=>`<button class="${S.tab===t[0]?"on":""}" data-t="${t[0]}">${t[1]}</button>`).join("")}</nav><span class="sp"></span><button class="b g s" id="out">Salir</button></header><main><div id="msg"></div>${inner}</main><div id="mo"></div>`;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{S.tab=b.dataset.t;render()});$("#out").onclick=()=>{S.tok=S.ref=null;try{sessionStorage.removeItem("lp")}catch(e){}loginView(false)};
if(S.msg)note(S.msg.m,S.msg.ok)}
async function render(){shell(`<p class="hint">Cargando…</p>`);try{S.lic=await rest("licenses?select=*&order=created_at.desc");await V[S.tab]()}catch(e){note(e.message)}}
const licName=id=>(S.lic.find(l=>l.id===id)||{}).license_key||"—";
const licOpts=(sel)=>S.lic.map(l=>`<option value="${l.id}" ${l.id===sel?"selected":""}>${esc(l.license_key)} · ${esc(l.customer_name||"")}</option>`).join("");
const main=h=>{$("main").innerHTML=`<div id="msg"></div>`+h;if(S.msg)note(S.msg.m,S.msg.ok)};

const V={
async stats(){const s=(await fn("admin-manage",{action:"stats"})).stats;const x=s.serials||{};
 main(`<div class="grid">${[["Licencias",s.licenses_total],["Activas",s.licenses_active],["Suspendidas",s.licenses_suspended],["Caducadas",s.licenses_expired],["Radios registradas",s.radios_registered],["Radios disponibles",s.radios_available],["Usuarios registrados",s.users_registered],["Usuarios disponibles",s.users_available],["Radios bloqueadas",s.devices_blocked],["Series disponibles",x.available||0],["Series activadas",x.activated||0],["Series bloqueadas/revocadas",(x.blocked||0)+(x.revoked||0)]].map(a=>`<div class="st"><b>${a[1]??0}</b><span>${a[0]}</span></div>`).join("")}</div>`)},
async lic(){const [ld,lu]=await Promise.all([rest("license_devices?select=license_id&status=eq.active"),rest("license_users?select=license_id&status=eq.active")]);
 const cnt=(a,id)=>a.filter(x=>x.license_id===id).length;
 main(`<div class="card"><div class="row" style="justify-content:space-between"><h2>Licencias</h2><button class="b" id="new">Nueva licencia</button></div><div class="tw"><table><tr><th>Clave</th><th>Cliente</th><th>Estado</th><th>Radios</th><th>Usuarios</th><th>Caduca</th><th>Gracia offline</th><th></th></tr>${S.lic.map(l=>{const r=cnt(ld,l.id),u=cnt(lu,l.id);return`<tr><td><b>${esc(l.license_key)}</b></td><td>${esc(l.customer_name||l.customer_id||"")}</td><td>${tag(l.status)}</td><td>${r}/${l.max_radios}<div class="bar"><i style="width:${r/l.max_radios*100}%"></i></div></td><td>${u}/${l.max_users}<div class="bar"><i style="width:${Math.min(100,u/l.max_users*100)}%"></i></div></td><td>${fd(l.expires_at)}</td><td>${l.offline_grace_hours} h</td><td class="row"><button class="b g s" data-e="${l.id}">Editar</button><button class="b ${l.status==="active"?"r":"g"} s" data-s="${l.id}">${l.status==="active"?"Suspender":"Reactivar"}</button></td></tr>`}).join("")||`<tr><td colspan=8 class="hint">Aún no hay licencias.</td></tr>`}</table></div></div>`);
 $("#new").onclick=()=>licForm();document.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>licForm(S.lic.find(l=>l.id===b.dataset.e)));
 document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>act(async()=>{const l=S.lic.find(x=>x.id===b.dataset.s);await fn("admin-manage",{action:"license_save",license:{...l,status:l.status==="active"?"suspended":"active"}});note("Estado actualizado",1);render()}))},
async ser(){const lic=S.sel||(S.lic[0]||{}).id;S.sel=lic;if(!lic)return main(`<div class="card hint">Crea primero una licencia.</div>`);
 const [sn,bt]=await Promise.all([rest(`serial_numbers?select=id,batch_id,code_hint,status,created_at,activated_at,activated_device_id&license_id=eq.${lic}&order=created_at.desc&limit=1000`),rest(`serial_batches?select=*&license_id=eq.${lic}&order=created_at.desc`)]);
 const bn=id=>(bt.find(b=>b.id===id)||{}).batch_name||"";const q=(S.q||"").toLowerCase();
 main(`<div class="card"><h2>Generar lote</h2><div class="f"><div><label>Licencia</label><select id="ls">${licOpts(lic)}</select></div><div><label>Nombre del lote</label><input id="bn" value="LOTE-${String(bt.length+1).padStart(4,"0")}"></div><div><label>Cantidad (1-200)</label><input id="bq" type="number" min="1" max="200" value="50"></div><button class="b" id="gen">Generar</button></div><p class="hint">Los códigos se muestran una sola vez al generarlos (en la base solo se guarda su huella). Descárgalos entonces.</p><div id="out"></div></div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2>Series de ${esc(licName(lic))} (${sn.length})</h2><input id="q" placeholder="Buscar últimos 4 caracteres / estado" value="${esc(S.q||"")}"></div><div class="tw"><table><tr><th>Serie</th><th>Lote</th><th>Estado</th><th>Generada</th><th>Activada</th><th></th></tr>${sn.filter(s=>!q||(s.code_hint+" "+s.status+" "+bn(s.batch_id)).toLowerCase().includes(q)).map(s=>`<tr><td>RAD-····-····-${esc(s.code_hint)}</td><td>${esc(bn(s.batch_id))}</td><td>${tag(s.status)}</td><td>${fd(s.created_at)}</td><td>${fd(s.activated_at)}</td><td class="row">${s.status!=="blocked"&&s.status!=="revoked"?`<button class="b g s" data-b="${s.id}">Bloquear</button><button class="b r s" data-r="${s.id}">Revocar</button>`:s.status==="blocked"&&!s.activated_device_id?`<button class="b g s" data-u="${s.id}">Desbloquear</button>`:""}</td></tr>`).join("")}</table></div></div>`);
 $("#ls").onchange=e=>{S.sel=e.target.value;render()};$("#q").oninput=e=>{S.q=e.target.value;clearTimeout(S.qt);S.qt=setTimeout(render,300)};
 $("#gen").onclick=()=>act(async()=>{const r=await fn("generate-serial-batch",{license_id:$("#ls").value,batch_name:$("#bn").value,quantity:+$("#bq").value});
  const csv="serie,licencia,lote\n"+r.codes.map(c=>`${c},${r.license_key},${r.batch_name}`).join("\n");const url=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
  $("#out").innerHTML=`<div class="msg o">Lote generado: ${r.codes.length} series. Guarda el archivo ahora; no se podrá volver a ver.</div><div class="row" style="margin-bottom:8px"><a class="b" style="text-decoration:none" download="${esc(r.license_key)}-${esc(r.batch_name)}.csv" href="${url}">Descargar CSV</a><button class="b g" id="cp">Copiar</button></div><div class="codes">${r.codes.join("\n")}</div>`;$("#cp").onclick=()=>navigator.clipboard.writeText(r.codes.join("\n"))});
 const st=(a,s)=>document.querySelectorAll(`[data-${a}]`).forEach(b=>b.onclick=()=>{if(a==="r"&&!confirm("¿Revocar esta serie? Si está en uso, la radio quedará bloqueada."))return;act(async()=>{await fn("admin-manage",{action:"serial_set",id:b.dataset[a],status:s});note("Serie actualizada",1);render()})});st("b","blocked");st("r","revoked");st("u","available")},
async dev(){const [dv,ld,us]=await Promise.all([rest("devices?select=id,serial_number,hardware_id,family,name,app_version,status,last_ip,created_at,last_seen_at&order=last_seen_at.desc.nullslast&limit=1000"),rest("license_devices?select=device_id,license_id,user_id,status&status=in.(active,blocked)"),rest("users?select=id,email")]);
 const q=(S.dq||"").toLowerCase();const row=d=>{const l=ld.find(x=>x.device_id===d.id);return{d,l}};
 main(`<div class="card"><div class="row" style="justify-content:space-between"><h2>Radios (${dv.length})</h2><input id="q" placeholder="Buscar serie, nombre, equipo, familia…" value="${esc(S.dq||"")}"></div><div class="tw"><table><tr><th>Serie</th><th>Familia</th><th>Equipo</th><th>Licencia</th><th>Usuario</th><th>Estado</th><th>Última conexión</th><th></th></tr>${dv.map(row).filter(({d,l})=>!q||[d.serial_number,d.name,d.hardware_id,d.family,d.status,l&&licName(l.license_id)].join(" ").toLowerCase().includes(q)).map(({d,l})=>`<tr><td>${esc(d.serial_number||"—")}</td><td>${esc({v1:"Radio MRP (v1)",v2:"Radio RP V2",v3:"Radio RP (v3)"}[d.family])}</td><td>${esc(d.name||"")}<div class="hint">${esc((d.hardware_id||"").slice(0,10))} · v${esc(d.app_version||"")}</div></td><td>${l?esc(licName(l.license_id)):"—"}</td><td>${l&&l.user_id?esc((us.find(u=>u.id===l.user_id)||{}).email||""):"—"}</td><td>${tag(d.status)}</td><td>${fd(d.last_seen_at)}<div class="hint">${esc(d.last_ip||"")}</div></td><td class="row">${d.status==="blocked"?`<button class="b g s" data-d="${d.id}|active">Desbloquear</button>`:d.status==="active"?`<button class="b r s" data-d="${d.id}|blocked">Bloquear</button><button class="b g s" data-rl="${d.id}">Liberar</button>`:""}<button class="b g s" data-h="${d.id}">Historial</button></td></tr>`).join("")}</table></div></div>`);
 $("#q").oninput=e=>{S.dq=e.target.value;clearTimeout(S.qt);S.qt=setTimeout(render,300)};
 document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>act(async()=>{const[i,s]=b.dataset.d.split("|");await fn("admin-manage",{action:"device_set",id:i,status:s});note("Radio actualizada",1);render()}));
 document.querySelectorAll("[data-rl]").forEach(b=>b.onclick=()=>{if(confirm("¿Liberar la asignación? La serie vuelve a quedar disponible y la radio tendrá que activarse de nuevo."))act(async()=>{await fn("admin-manage",{action:"device_release",id:b.dataset.rl,reissue:true});note("Asignación liberada",1);render()})});
 document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>hist("device",b.dataset.h))},
async usr(){const [us,lu]=await Promise.all([rest("users?select=*&order=created_at.desc&limit=1000"),rest("license_users?select=user_id,license_id,status")]);const q=(S.uq||"").toLowerCase();
 main(`<div class="card"><div class="row" style="justify-content:space-between"><h2>Usuarios (${us.length})</h2><div class="row"><input id="q" placeholder="Buscar…" value="${esc(S.uq||"")}"><button class="b" id="nu">Crear usuario</button></div></div><div class="tw"><table><tr><th>Correo</th><th>Nombre</th><th>Licencias</th><th>Varias licencias</th><th>Estado</th><th></th></tr>${us.filter(u=>!q||(u.email+" "+(u.full_name||"")).toLowerCase().includes(q)).map(u=>`<tr><td>${esc(u.email)}</td><td>${esc(u.full_name||"")}</td><td>${lu.filter(x=>x.user_id===u.id).map(x=>`<span class="tag ${x.status}">${esc(licName(x.license_id))}</span> `).join("")}</td><td><input type="checkbox" data-m="${u.id}" ${u.multi_license?"checked":""}></td><td>${tag(u.status)}</td><td class="row"><button class="b ${u.status==="active"?"r":"g"} s" data-u="${u.id}|${u.status==="active"?"disabled":"active"}">${u.status==="active"?"Desactivar":"Reactivar"}</button><button class="b g s" data-h="${u.id}">Historial</button></td></tr>`).join("")}</table></div></div>`);
 $("#q").oninput=e=>{S.uq=e.target.value;clearTimeout(S.qt);S.qt=setTimeout(render,300)};
 $("#nu").onclick=()=>{$("#mo").innerHTML=`<div class="mo"><div class="card"><h2>Crear usuario</h2><div class="f"><div><label>Licencia</label><select id="ul">${licOpts()}</select></div></div><div class="f"><div><label>Correo</label><input id="ue" type="email"></div><div><label>Nombre</label><input id="un"></div></div><div class="f"><div><label>Contraseña inicial (8+)</label><input id="up" type="text"></div></div><div class="row"><button class="b" id="uok">Crear</button><button class="b g" id="ux">Cancelar</button></div></div></div>`;$("#ux").onclick=()=>$("#mo").innerHTML="";$("#uok").onclick=()=>act(async()=>{await fn("admin-manage",{action:"user_create",license_id:$("#ul").value,email:$("#ue").value,name:$("#un").value,password:$("#up").value});$("#mo").innerHTML="";note("Usuario creado",1);render()})};
 document.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>act(async()=>{const[i,s]=b.dataset.u.split("|");await fn("user-deactivate",{user_id:i,status:s});note("Usuario actualizado",1);render()}));
 document.querySelectorAll("[data-m]").forEach(c=>c.onchange=()=>act(async()=>{await fn("admin-manage",{action:"user_multi",user_id:c.dataset.m,value:c.checked});note("Guardado",1)}));
 document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>hist("user",b.dataset.h))},
async aud(){const q=S.aq||"";const l=await rest("license_audit_logs?select=*&order=created_at.desc&limit=300"+(q?`&action=ilike.*${encodeURIComponent(q)}*`:""));
 main(`<div class="card"><div class="row" style="justify-content:space-between"><h2>Auditoría</h2><input id="q" placeholder="Filtrar por acción (p. ej. device_activated)" value="${esc(q)}"></div><div class="tw"><table><tr><th>Fecha</th><th>Licencia</th><th>Actor</th><th>Acción</th><th>Detalle</th><th>IP</th></tr>${l.map(a=>`<tr><td>${fd(a.created_at)}</td><td>${a.license_id?esc(licName(a.license_id)):"—"}</td><td>${esc(a.actor_type)}</td><td>${esc(a.action)}</td><td class="hint">${esc(JSON.stringify(a.details))}</td><td>${esc(a.ip||"")}</td></tr>`).join("")}</table></div></div>`);
 $("#q").onchange=e=>{S.aq=e.target.value.trim();render()}}
};
async function hist(kind,id){const l=await rest("license_audit_logs?select=*&order=created_at.desc&limit=500");const rows=l.filter(a=>JSON.stringify(a).includes(id));
 const ses=await rest(`device_sessions?select=*&${kind==="device"?"device_id":"user_id"}=eq.${id}&order=started_at.desc&limit=50`);
 $("#mo").innerHTML=`<div class="mo"><div class="card"><h2>Historial</h2><h3 class="hint">Sesiones</h3>${ses.map(s=>`<div>${tag(s.status)} ${fd(s.started_at)} → ${fd(s.ended_at||s.last_validation_at)} · ${esc(licName(s.license_id))} · ${esc(s.ip||"")}</div>`).join("")||'<div class="hint">Sin sesiones</div>'}<h3 class="hint">Eventos</h3>${rows.map(a=>`<div>${fd(a.created_at)} · ${esc(a.action)}</div>`).join("")||'<div class="hint">Sin eventos</div>'}<div class="row" style="margin-top:12px"><button class="b g" id="hx">Cerrar</button></div></div></div>`;$("#hx").onclick=()=>$("#mo").innerHTML=""}
function licForm(l){l=l||{max_radios:200,max_users:50,offline_grace_hours:24,status:"active"};
 $("#mo").innerHTML=`<div class="mo"><div class="card"><h2>${l.id?"Editar":"Nueva"} licencia</h2><div class="f"><div><label>Clave (vacía = automática)</label><input id="k" value="${esc(l.license_key||"")}" ${l.id?"disabled":""} placeholder="LIC-0001"></div><div><label>Cliente</label><input id="cn" value="${esc(l.customer_name||"")}"></div><div><label>ID cliente</label><input id="ci" value="${esc(l.customer_id||"")}"></div></div>
 <div class="f"><div><label>Máx. radios (1-200)</label><input id="mr" type="number" min="1" max="200" value="${l.max_radios}"></div><div><label>Máx. usuarios</label><input id="mu" type="number" min="1" value="${l.max_users}"></div><div><label>Gracia sin conexión (h)</label><input id="gr" type="number" min="1" max="720" value="${l.offline_grace_hours}"></div></div>
 <div class="f"><div><label>Estado</label><select id="st">${["active","suspended","revoked"].map(s=>`<option value="${s}" ${l.status===s?"selected":""}>${s}</option>`).join("")}</select></div><div><label>Caduca (vacío = nunca)</label><input id="ex" type="date" value="${l.expires_at?l.expires_at.slice(0,10):""}"></div></div>
 <div class="row"><button class="b" id="ok">Guardar</button><button class="b g" id="no">Cancelar</button></div></div></div>`;$("#no").onclick=()=>$("#mo").innerHTML="";
 $("#ok").onclick=()=>act(async()=>{await fn("admin-manage",{action:"license_save",license:{id:l.id,license_key:$("#k").value,customer_name:$("#cn").value,customer_id:$("#ci").value,max_radios:+$("#mr").value,max_users:+$("#mu").value,offline_grace_hours:+$("#gr").value,status:$("#st").value,expires_at:$("#ex").value?new Date($("#ex").value+"T23:59:59").toISOString():null}});$("#mo").innerHTML="";note("Licencia guardada",1);render()})}
S.tok?start():loginView(false);
</script></body></html>
